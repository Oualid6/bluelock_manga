[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/cover-image"
  to = "/.netlify/functions/cover-image"
  status = 200

[[redirects]]
  from = "/chapter-images"
  to = "/.netlify/functions/chapter-images"
  status = 200

[[redirects]]
  from = "/proxy-image"
  to = "/.netlify/functions/proxy-image"
  status = 200

# Direct Static Page Clean URLs
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/terms-and-conditions"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/dmca"
  to = "/dmca.html"
  status = 200

[[redirects]]
  from = "/disclaimer"
  to = "/disclaimer.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# Language Prefixed Static Pages
[[redirects]]
  from = "/:lang/privacy.html"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/:lang/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/:lang/terms.html"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/:lang/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/:lang/dmca.html"
  to = "/dmca.html"
  status = 200

[[redirects]]
  from = "/:lang/dmca"
  to = "/dmca.html"
  status = 200

[[redirects]]
  from = "/:lang/disclaimer.html"
  to = "/disclaimer.html"
  status = 200

[[redirects]]
  from = "/:lang/disclaimer"
  to = "/disclaimer.html"
  status = 200

[[redirects]]
  from = "/:lang/contact.html"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/:lang/contact"
  to = "/contact.html"
  status = 200

# Reader SPA Catch-Alls
[[redirects]]
  from = "/chapter/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/chapters"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/en/*"
